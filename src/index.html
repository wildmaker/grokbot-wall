<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Grok Bot · Check-in Wall</title>
<meta name="viewport" content="width=device-width,initial-scale=1">
<link rel="icon" href="data:,">
<style>
  :root { --accent:#4F9CF9; --fg:#ececf1; --dim:#8a8f9a; --line:#2a2d35; --bg:#06070a; --mono:"JetBrains Mono","SF Mono",Menlo,Consolas,"DejaVu Sans Mono",monospace; }
  [hidden]{display:none!important}
  html,body{margin:0;height:100%;background:#000;overflow:hidden;font-family:var(--mono);color:var(--fg)}
  #stage{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:#000}
  #gl{display:block}
  button{font:inherit;color:var(--fg);background:transparent;border:1px solid var(--line);padding:6px 12px;cursor:pointer;letter-spacing:.04em;text-transform:uppercase;font-size:12px}
  button:hover{border-color:var(--accent);color:#fff}
  button.primary{background:var(--accent);border-color:var(--accent);color:#000;font-weight:600}
  button.danger:hover{border-color:#ff4d4d;color:#ff7b7b}
  input,select{font:inherit;color:var(--fg);background:#0b0d12;border:1px solid var(--line);padding:8px 10px;outline:none;font-size:13px}
  input:focus,select:focus{border-color:var(--accent)}
  /* desk console */
  #desk{position:fixed;inset:20px;background:rgba(6,7,10,.96);border:1px solid var(--accent);display:flex;flex-direction:column;font-size:13px;line-height:1.5;box-shadow:0 0 0 1px #000,0 40px 120px rgba(0,0,0,.85);z-index:10}
  .dk-head{display:flex;gap:8px;align-items:center;padding:10px 14px;border-bottom:1px solid var(--line)}
  .dk-title{color:var(--accent);font-weight:600;letter-spacing:.04em}
  .dk-sub{color:var(--dim);margin-left:8px}
  .dk-spacer{flex:1}
  .dk-poll{display:inline-flex;align-items:center;gap:7px;border:1px solid var(--line);padding:5px 9px;cursor:pointer;white-space:nowrap;color:var(--dim);font-size:11px;letter-spacing:.04em}
  .dk-poll:hover{border-color:var(--accent);color:#fff}
  .dk-poll input{position:absolute;opacity:0;pointer-events:none}
  .dk-poll-track{width:30px;height:14px;border:1px solid #555;background:#111;position:relative;box-sizing:border-box}
  .dk-poll-track::after{content:"";position:absolute;width:8px;height:8px;left:2px;top:2px;background:#777;transition:transform .12s ease,background .12s ease}
  .dk-poll input:checked+.dk-poll-track{border-color:var(--accent)}
  .dk-poll input:checked+.dk-poll-track::after{background:var(--accent);transform:translateX(16px)}
  .dk-poll input:focus-visible+.dk-poll-track{outline:2px solid #fff;outline-offset:2px}
  .dk-poll:has(input:disabled){opacity:.45;cursor:not-allowed}
  .dk-stat{display:inline-flex;align-items:center;gap:7px;border:1px solid var(--line);padding:5px 9px;white-space:nowrap;color:var(--dim);font-size:11px;letter-spacing:.04em;max-width:340px;overflow:hidden;text-overflow:ellipsis}
  .dk-stat i{width:8px;height:8px;border-radius:50%;background:#555;flex:none}
  .dk-stat.ok{color:#fff;border-color:var(--accent)} .dk-stat.ok i{background:var(--accent);box-shadow:0 0 6px var(--accent)}
  .dk-stat.warn{color:#ffd166;border-color:#7a5c14} .dk-stat.warn i{background:#ffd166}
  .dk-stat.bad{color:#ff7b7b;border-color:#ff4d4d} .dk-stat.bad i{background:#ff4d4d}
  /* Luma connection card in the settings modal */
  .lc{--c:#6b7280;border:2px solid var(--c);margin:0 0 18px;background:#090b10}
  .lc.ok{--c:#3ddc84} .lc.warn{--c:#ffd166} .lc.bad{--c:#ff4d4d}
  .lc-top{display:flex;align-items:center;gap:14px;padding:14px 16px;background:color-mix(in srgb,var(--c) 14%,transparent)}
  .lc-dot{width:18px;height:18px;border-radius:50%;background:var(--c);flex:none}
  .lc.ok .lc-dot{box-shadow:0 0 12px var(--c);animation:lcpulse 1.6s ease-in-out infinite} .lc.bad .lc-dot{animation:lcpulse .8s ease-in-out infinite}
  @keyframes lcpulse{50%{opacity:.35}}
  .lc-head{font-size:19px;font-weight:700;line-height:1.25;color:var(--c);letter-spacing:.02em}
  .lc-act{color:#c9ccd4;font-size:12px;margin-top:3px;line-height:1.5}
  .lc-rows{padding:8px 16px 10px;border-top:1px solid var(--line)}
  .lc-row{display:grid;grid-template-columns:20px 74px 1fr;gap:8px;padding:4px 0;font-size:12px;line-height:1.5;align-items:baseline}
  .lc-row .m{font-weight:700;text-align:center} .lc-row .n{color:var(--dim)} .lc-row .d{color:#c9ccd4;word-break:break-word}
  .lc-row.ok .m{color:#3ddc84} .lc-row.warn .m{color:#ffd166} .lc-row.bad .m{color:#ff4d4d} .lc-row.bad .d{color:#ff9b9b} .lc-row.off .m{color:#6b7280}
  .dk-body{display:flex;flex:1;min-height:0}
  .dk-left{width:46%;display:flex;flex-direction:column;border-right:1px solid var(--line)}
  .dk-left input{margin:12px 14px;flex:none}
  #dk-list{overflow:auto;flex:1;padding:0 6px 12px}
  .g-row{display:grid;grid-template-columns:1fr auto auto auto;gap:10px;align-items:center;padding:7px 10px;border:1px solid transparent;cursor:pointer}
  .g-row:hover{background:#0f1218}
  .g-row.sel{border-color:var(--accent);background:#0f1420}
  .g-name{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .g-email{color:var(--dim);font-size:11px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .badge{font-size:10px;letter-spacing:.08em;text-transform:uppercase;padding:2px 7px;border:1px solid var(--line);color:var(--dim);white-space:nowrap}
  .badge.in{border-color:var(--accent);color:var(--accent)}
  .badge.code{color:#fff;border-color:#3a3f4a}
  .badge.bad{border-color:#ff4d4d;color:#ff7b7b}
  .d-mail{border:1px solid var(--line);padding:12px 16px;margin:12px 0;display:flex;gap:14px;align-items:center;flex-wrap:wrap;color:#c9ccd4}
  .d-mail .p{color:var(--accent);font-size:11px;letter-spacing:.1em;text-transform:uppercase}
  .dk-right{flex:1;overflow:auto;padding:22px 26px}
  .dk-empty{color:var(--dim)}
  .d-name{font-size:26px;font-weight:600;letter-spacing:-.01em;margin:0 0 4px}
  .d-meta{color:var(--dim);margin-bottom:18px}
  .d-code{border:1px solid var(--line);padding:16px 18px;margin:12px 0;display:flex;gap:22px;align-items:flex-start}
  .d-code img{image-rendering:pixelated;width:168px;height:168px;background:#fff;flex:none}
  .d-code .c{font-size:22px;font-weight:600;letter-spacing:.02em;color:#fff;word-break:break-all}
  .d-code .u{color:var(--dim);font-size:12px;word-break:break-all;margin:6px 0 12px}
  .d-code .p{color:var(--accent);font-size:11px;letter-spacing:.1em;text-transform:uppercase;margin-bottom:6px}
  .row{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}
  .hint{color:var(--dim);font-size:12px;margin-top:20px;line-height:1.7}
  kbd{border:1px solid var(--line);padding:0 5px;color:#fff}
  /* modal */
  #modal{position:fixed;inset:0;background:rgba(0,0,0,.65);display:flex;align-items:center;justify-content:center;z-index:20}
  .md-box{width:min(560px,92vw);background:#07080c;border:1px solid var(--accent);padding:22px 24px;font-size:13px;max-height:88vh;overflow:auto}
  .md-box h3{margin:0 0 14px;font-size:13px;letter-spacing:.1em;text-transform:uppercase;color:var(--accent)}
  .field{display:flex;flex-direction:column;gap:6px;margin:10px 0}
  .field label{color:var(--dim);font-size:11px;letter-spacing:.08em;text-transform:uppercase}
  .field input,.field select{width:100%;box-sizing:border-box}
  #toast{position:fixed;left:50%;bottom:36px;transform:translateX(-50%);background:#0b0d12;border:1px solid var(--accent);padding:10px 16px;font-size:13px;z-index:30;pointer-events:none}
  #err{position:fixed;top:0;left:0;right:0;background:#3a0b0b;color:#ffb3b3;padding:8px 14px;font-size:12px;z-index:40;white-space:pre-wrap}
  /* Bottom hover reveal: large SETTINGS entry appears only while the cursor is in the lower third. */
  #desk-open{position:fixed;left:50%;bottom:42px;z-index:8;transform:translate(-50%,18px);opacity:0;pointer-events:none;display:inline-flex;flex-direction:column;align-items:center;gap:10px;padding:18px 40px 16px;background:linear-gradient(180deg,rgba(6,7,10,.55),rgba(6,7,10,.92));border:1px solid var(--accent);color:var(--accent);font:700 clamp(32px,5vw,60px)/1.1 "PingFang SC","Hiragino Sans GB","Microsoft YaHei",var(--mono);letter-spacing:.12em;cursor:pointer;box-shadow:0 16px 48px rgba(0,0,0,.55);transition:opacity .18s ease,transform .18s ease,color .12s ease,border-color .12s ease}
  #desk-open .desk-open-sub{font:500 13px/1.4 "PingFang SC","Hiragino Sans GB","Microsoft YaHei",var(--mono);letter-spacing:.08em;color:var(--dim)}
  #desk-open .desk-open-sub kbd{border-color:#555;color:var(--fg);font-size:10px;padding:1px 5px;letter-spacing:.04em;margin:0 2px;font-family:var(--mono)}
  body.celebrating #desk-open{opacity:0!important;pointer-events:none!important}   /* never cover the welcome banner */
  body.desk-reveal:not(.desk-open) #desk-open{opacity:1;transform:translate(-50%,0);pointer-events:auto}
  #desk-open:hover,#desk-open:focus-visible{color:#fff;border-color:#fff}
  #desk-open:focus-visible{outline:2px solid #fff;outline-offset:3px}
  body.desk-open #desk-open{display:none}
  /* Always-visible corner entry (the big one above still reveals on bottom hover). */
  #desk-corner{position:fixed;right:20px;bottom:20px;z-index:7;padding:11px 18px;background:rgba(6,7,10,.92);border:1px solid var(--accent);color:var(--accent);font:700 16px/1 "PingFang SC","Hiragino Sans GB","Microsoft YaHei",var(--mono);letter-spacing:.1em;cursor:pointer;box-shadow:0 8px 28px rgba(0,0,0,.6),0 0 0 1px rgba(255,255,255,.08);text-transform:none;transition:color .12s ease,border-color .12s ease,background .12s ease}
  #desk-corner:hover,#desk-corner:focus-visible{color:#fff;border-color:#fff;background:rgba(11,18,32,.96)}
  #desk-corner:focus-visible{outline:2px solid #fff;outline-offset:3px}
  body.desk-open #desk-corner{display:none}
</style>
</head>
<body>
<div id="stage"><canvas id="gl"></canvas></div>

<button id="desk-open" type="button" title="打开设置">
  设置
  <span class="desk-open-sub">签到控制台 · 按 <kbd>D</kbd></span>
</button>
<button id="desk-corner" type="button" title="打开设置（D）" aria-label="打开设置">⚙ 设置</button>

<div id="desk" hidden>
  <div class="dk-head">
    <span class="dk-title">▌ 签到控制台</span><span class="dk-sub" id="dk-mode"></span>
    <span class="dk-spacer"></span>
    <span class="dk-stat" id="dk-stat" role="status" aria-live="polite"><i></i><span id="dk-stat-text">状态</span></span>
    <label class="dk-poll" for="dk-polling" title="开启或暂停 Luma 签到轮询">
      <input id="dk-polling" type="checkbox" role="switch">
      <span class="dk-poll-track" aria-hidden="true"></span>
      <span id="dk-poll-label">轮询关</span>
    </label>
    <button id="dk-reset" class="danger" title="清空墙上的签到名单，并从 Luma 重新读取一次最新的已签到名单（不会触发欢迎动画）">重置</button>
    <label class="dk-poll" for="dk-codes" title="开启后，新签到的来宾会分到兑换码并收到邮件；默认关闭，只做签到欢迎">
      <input id="dk-codes" type="checkbox" role="switch">
      <span class="dk-poll-track" aria-hidden="true"></span>
      <span id="dk-codes-label">不发码</span>
    </label>
    <button id="dk-manual">+ 手动签到</button>
    <button id="dk-export">导出 CSV</button>
    <button id="dk-settings">设置</button>
    <button id="dk-close">关闭 [esc]</button>
  </div>
  <div class="dk-body">
    <div class="dk-left">
      <input id="dk-q" placeholder="搜索姓名或邮箱…" autocomplete="off" spellcheck="false">
      <div id="dk-list"></div>
    </div>
    <div class="dk-right" id="dk-detail"><div class="dk-empty">选择一位来宾查看兑换码</div></div>
  </div>
</div>
<div id="modal" hidden><div class="md-box" id="md-box"></div></div>
<div id="toast" hidden></div>
<div id="err" hidden></div>

<script src="vendor/three.min.js" data-inline></script>
<script src="vendor/qrcode.min.js" data-inline></script>
<script>
'use strict';
// =====================================================================
//  CONFIG & DATA
// =====================================================================
const CODES = /*@codes*/null; // {A:[{code,url}],B:[{code,url}],labels:{A,B}}
const params = new URLSearchParams(location.search);
const RAW = params.has('raw');
const WALL_KEY = params.get('key') || '';
const api = (path, init = {}) => fetch(path, { ...init, headers: { ...(init.headers || {}), ...(WALL_KEY ? { 'x-wall-key': WALL_KEY } : {}) } });
const $ = s => document.querySelector(s);
const clamp = (v, a, b) => v < a ? a : v > b ? b : v;
const lerp = (a, b, t) => a + (b - a) * t;
const pad2 = n => String(n).padStart(2, '0');
const pad3 = n => String(n).padStart(3, '0');
const nowS = () => performance.now() / 1000;
const fmtHM = iso => { const d = new Date(iso); return isNaN(d) ? '--:--' : `${pad2(d.getHours())}:${pad2(d.getMinutes())}`; };
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));

const hex2rgb = h => [parseInt(h.slice(1, 3), 16), parseInt(h.slice(3, 5), 16), parseInt(h.slice(5, 7), 16)];
const mixRgb = (a, b, t) => a.map((v, i) => Math.round(v + (b[i] - v) * t));
const rgb2hex = c => '#' + c.map(v => v.toString(16).padStart(2, '0')).join('');
// Grok Bot brand colours. `ui` is the accent used for text when the body colour itself is too bright/dull.
const BRAND = [
  { name: 'WHITE',   hex: '#FFFFFF', ui: '#0B72E1' },
  { name: 'BROWN',   hex: '#7B4B2A', ui: '#FFA100' },
  { name: 'RED',     hex: '#E4232F' },
  { name: 'ORANGE',  hex: '#FF5A00' },
  { name: 'AMBER',   hex: '#FFA100' },
  { name: 'GREEN',   hex: '#00A65A' },
  { name: 'TEAL',    hex: '#00A88E' },
  { name: 'BLUE',    hex: '#0B72E1' },
  { name: 'PURPLE',  hex: '#8A4CF0' },
  { name: 'MAGENTA', hex: '#E5218C' },
  { name: 'GREY',    hex: '#6E6E6E', ui: '#8A4CF0' },
].map(c => { const main = c.ui || c.hex; const rgb = hex2rgb(main); const lightRgb = mixRgb(rgb, [255, 255, 255], 0.45), deepRgb = mixRgb(rgb, [0, 0, 0], 0.5); return { ...c, main, rgb, lightRgb, deepRgb, light: rgb2hex(lightRgb), deep: rgb2hex(deepRgb) }; });
const CHROMA = ['RED', 'ORANGE', 'AMBER', 'GREEN', 'TEAL', 'BLUE', 'PURPLE', 'MAGENTA'].map(n => BRAND.findIndex(c => c.name === n));
const WHITE = [240, 240, 244], GREY = [128, 134, 148], DIM = [66, 70, 82], BLACK = [0, 0, 0];
let colorIdx = 0, celebColor = 6;           // white body + blue UI to start; check-ins walk the colour wheel
const accent = () => BRAND[colorIdx];
const bodyHex = () => BRAND[colorIdx].hex;
function bgTriple() {
  const k = Math.max(0, CHROMA.indexOf(BRAND.findIndex(c => c.hex === accent().main)));
  return [BRAND[CHROMA[k]], BRAND[CHROMA[(k + 1) % 8]], BRAND[CHROMA[(k + 7) % 8]]].map(c => new THREE.Color(c.main));
}

const DEMO_NAMES = ['Wei Lin Tan', 'Arjun Menon', 'Sofia Reyes', 'Kenji Watanabe', 'Priya Nair', 'Marcus Lim', 'Aisha Rahman', 'Daniel Ng', 'Chloe Zhang', 'Ravi Kumar', 'Hana Yusof', 'Jonas Berg', 'Mei Ling Chua', 'Tom Okafor', 'Nadia Hussain', 'Ethan Goh', 'Lucia Fernandez', 'Ibrahim Salleh', 'Grace Koh', 'Leon Müller', 'Sarah Teo', 'Vikram Shah', 'Yuki Tanaka', 'Ben Carter', 'Amira Zain', 'Felix Ong', 'Nur Aisyah', 'Oscar Lee', 'Zara Ahmed', 'Kai Wong', 'Elena Petrova', 'Samuel Choo', 'Ines Duarte', 'Rohan Iyer', 'Jade Lau', 'Noah Kim', 'Farah Ismail', 'Liam Tan', 'Anya Bose', 'Dylan Foo'];

// =====================================================================
//  APP STATE
// =====================================================================
const app = {
  mode: 'boot',            // boot | demo | luma | manual
  server: false, luma: false,
  eventId: null, eventName: '', eventStart: null,
  total: 0,                // approved guests
  regTotal: 0,             // registered guests of the Luma event (public count; 0 = unknown)
  guests: new Map(),       // key -> {key,id,name,email,checkedInAt,approval}
  alloc: new Map(),        // key -> allocation
  feed: [],                // allocations newest first
  config: { eventId: null, poolMode: 'A-then-B', pollMs: 5000, pollEnabled: false, sendCodes: false },
  labels: (CODES && CODES.labels) || { A: 'Pool A', B: 'Pool B' },
  poolTotals: { A: CODES ? CODES.A.length : 0, B: CODES ? CODES.B.length : 0 },
  poller: null, pollerAt: 0, event: null, lastSync: 0, syncing: false, error: '', initial: true, persist: false, email: null, lastWebhookAt: null, serverPolls: false, failedSyncs: 0, headline: '',
  dirty: true,
};
const celeb = { active: null, queue: [], t0: 0, dur: 5.2, flash: 0 };

function codeIndex(cd) {
  if (cd.n) return cd.n;
  const pool = CODES && CODES[cd.pool];
  if (!pool) return 0;
  const i = pool.findIndex(c => c.code === cd.code);
  return i < 0 ? 0 : i + 1;
}
// public-screen privacy: 'Ada Lovelace' → 'Ada L.' (the desk still shows full names)
const publicName = n => { const p = String(n || '').trim().split(/\s+/).filter(Boolean); return p.length > 1 ? `${p[0]} ${[...p[p.length - 1]][0].toUpperCase()}.` : (p[0] || 'Guest'); };
function codeTag(a) { return a.codes && a.codes.length ? a.codes.map(cd => `${cd.pool}#${pad3(codeIndex(cd))}`).join('+') : 'NONE'; }
const mailCounts = () => { let sent = 0, failed = 0; for (const a of app.alloc.values()) { const st = a.mail && a.mail.status; if (st === 'sent' || st === 'dry') sent++; else if (st === 'failed') failed++; } return { sent, failed }; };
function usedIn(pool) { let n = 0; for (const a of app.alloc.values()) for (const c of a.codes) if (c.pool === pool) n++; return n; }
function creditsLeft() { return (app.poolTotals.A - usedIn('A')) + (app.poolTotals.B - usedIn('B')); }

// ---- persistence (server first, localStorage fallback) ----
const LS = 'grokbot.state.v1';
function loadLocal() { try { const s = JSON.parse(localStorage.getItem(LS) || 'null'); if (s) { (s.allocations || []).forEach(a => app.alloc.set(a.key, a)); Object.assign(app.config, s.config || {}); } } catch {} }
function saveLocal() { try { localStorage.setItem(LS, JSON.stringify({ allocations: [...app.alloc.values()], config: app.config })); } catch {} }

function localAllocate(body) {
  const key = body.key.toLowerCase();
  if (app.alloc.has(key)) return app.alloc.get(key);
  const used = new Set(); for (const a of app.alloc.values()) for (const c of a.codes) used.add(c.code);
  const pick = pool => { const c = ((CODES && CODES[pool]) || []).find(c => !used.has(c.code)); return c ? { pool, code: c.code, url: c.url } : null; };
  const codes = [];
  if (!app.config.sendCodes) { /* codes off: check-in only */ }
  else if (app.config.poolMode === 'both') { for (const p of ['A', 'B']) { const c = pick(p); if (c) codes.push(c); } }
  else for (const p of (app.config.poolMode === 'B-then-A' ? ['B', 'A'] : ['A', 'B'])) { const c = pick(p); if (c) { codes.push(c); break; } }
  return { key, name: body.name || '', email: body.email || '', checkedInAt: body.checkedInAt || null, source: body.source || 'luma', at: new Date().toISOString(), codes };
}

async function ensureAllocated(guest, { celebrate }) {
  const key = guest.key.toLowerCase();
  if (app.alloc.has(key)) return app.alloc.get(key);
  const body = { key, name: guest.name, email: guest.email, checkedInAt: guest.checkedInAt, source: guest.source || 'luma' };
  let a;
  if (app.persist) {
    const r = await api('/allocate', { method: 'POST', headers: { 'content-type': 'application/json' }, body: JSON.stringify(body) });
    if (!r.ok) throw new Error('allocate failed ' + r.status);
    a = (await r.json()).allocation;
  } else { a = localAllocate(body); }
  if (app.alloc.has(key)) return app.alloc.get(key);
  addAllocation(a, celebrate);
  if (!app.persist && app.mode !== 'demo') saveLocal();
  return a;
}
function addAllocation(a, celebrate) {
  app.alloc.set(a.key, a);
  app.feed.unshift(a);
  app.feed.sort((x, y) => new Date(y.checkedInAt || y.at) - new Date(x.checkedInAt || x.at));
  if (celebrate) { celeb.queue.push(a); }
  app.dirty = true;
}
async function pushConfig(patch) {
  Object.assign(app.config, patch);
  if (app.server) await api('/config', { method: 'POST', headers: { 'content-type': 'application/json' }, body: JSON.stringify(patch) }).catch(() => {});
  else if (app.mode !== 'demo') saveLocal();
}

// =====================================================================
//  LUMA
// =====================================================================
async function lumaGet(path, q) {
  const u = new URL('/luma' + path, location.origin);
  Object.entries(q || {}).forEach(([k, v]) => v != null && u.searchParams.set(k, v));
  const r = await api(u);
  if (!r.ok) { let m = ''; try { m = (await r.json()).message || ''; } catch {} throw new Error(`Luma ${r.status} ${m}`); }
  return r.json();

    ${app.luma ? `<div class="field"><label>Luma 活动</label><select name="eventId"><option value="">自动（最近一场）</option>${evOpts}</select></div>` : `<div class="field"><label>Luma</label><div class="dk-empty">官方 API 轮询未开启（无 LUMA_API_KEY）。签到来自浏览器会话轮询：npm run checkins:on。</div></div>`}
    ${app.server ? `<div class="field"><label>Luma 活动链接或 ID${app.event && app.event.name ? ` · 当前：${esc(app.event.name)}` : ''}</label><input name="eventRef" value="${esc(app.config.eventId || '')}" placeholder="https://luma.com/your-event" autocomplete="off" spellcheck="false"></div>` : ''}
    <div class="field"><label>发放 Credits</label><label class="dk-poll" for="sf-send" style="align-self:flex-start"><input id="sf-send" name="sendCodes" type="checkbox" role="switch"${app.config.sendCodes ? ' checked' : ''}><span class="dk-poll-track" aria-hidden="true"></span><span id="sf-send-label">${app.config.sendCodes ? '发放中' : '不发放'}</span></label></div>
    <div id="sf-credits"${app.config.sendCodes ? '' : ' hidden'}>
    <div class="field"><label>兑换码池</label><select name="poolMode"><option value="A-then-B"${app.config.poolMode === 'A-then-B' ? ' selected' : ''}>每位来宾一个码 · 先 A 池再 B 池</option><option value="B-then-A"${app.config.poolMode === 'B-then-A' ? ' selected' : ''}>每位来宾一个码 · 先 B 池再 A 池</option><option value="both"${app.config.poolMode === 'both' ? ' selected' : ''}>每位来宾两个码 · A、B 各一</option></select></div>
    <div class="field"><label>邮件发送</label><div class="dk-empty">${!app.server ? '需要 serve.mjs' : !app.email || !app.email.enabled ? '关闭 — 在 .env 设置 RESEND_API_KEY（和 EMAIL_FROM）后重启 serve.mjs' : `Resend · 发件人 ${esc(app.email.from)}${app.email.dryRun ? ' · 试跑（不会真发）' : ''}${app.email.testTo ? ` · 所有邮件改发到 ${esc(app.email.testTo)}` : ''}`}</div></div>
    ${app.server && app.email && app.email.enabled ? `<div class="field"><label>发一封测试邮件（假兑换码）到</label><div class="row" style="margin:0"><input id="sf-testto" type="email" placeholder="you@example.com" style="flex:1" autocomplete="off"><button type="button" id="sf-test">发送测试</button></div></div>` : ''}
    <div class="hint">码池：A = ${esc(app.labels.A)}（${app.poolTotals.A}）· B = ${esc(app.labels.B)}（${app.poolTotals.B}）</div>
    </div>
    <div class="field"><label>轮询间隔（秒）</label><input name="poll" type="number" min="2" max="60" value="${Math.round(app.config.pollMs / 1000)}"></div>
    <div class="field"><label>单元格高度 px（字号，会刷新页面）</label><input name="cell" type="number" min="12" max="40" value="${G.ch}"></div>
    <div class="row"><button class="primary" type="submit">保存</button><button type="button" id="sf-cancel">取消</button></div>
    <div class="hint">状态${app.persist ? '保存在服务器 data/state.json' : app.mode === 'demo' ? '不保存（演示）' : '仅保存在本浏览器'}。</div></form>`);
  renderLumaCard();
  $('#sf-cancel').onclick = closeModal;
  $('#sf-send').onchange = e => { $('#sf-credits').hidden = !e.target.checked; $('#sf-send-label').textContent = e.target.checked ? '发放中' : '不发放'; };
  const tb = $('#sf-test');
  if (tb) tb.onclick = async () => {
    const to = $('#sf-testto').value.trim(); if (!to) { toast('请填写邮箱'); return; }
    tb.disabled = true; tb.textContent = '发送中…';
    try { const r = await api('/email/test', { method: 'POST', headers: { 'content-type': 'application/json' }, body: JSON.stringify({ to }) }); const j = await r.json();
      toast(j.result ? (j.result.status === 'failed' ? `失败：${j.result.error}` : j.result.status === 'dry' ? `试跑成功 → ${to}` : `已发至 ${to}（${j.result.id || 'ok'}）`) : (j.message || '错误')); }
    catch (e) { toast('错误：' + e.message); }
    tb.disabled = false; tb.textContent = '发送测试';
  };
  $('#sf').onsubmit = async e => {
    e.preventDefault(); const fd = new FormData(e.target);
    const patch = { pollMs: clamp(Number(fd.get('poll')) || 5, 2, 60) * 1000, sendCodes: fd.has('sendCodes') };
    if (patch.sendCodes) patch.poolMode = String(fd.get('poolMode'));
    const eventRef = String(fd.get('eventRef') || '').trim();
    let eventChanged = false;
    if (eventRef && eventRef !== app.config.eventId) {   // the field is pre-filled with the current event, so only re-resolve when it was edited; the server resolves a pasted link to an evt- id and name
      const r = await api('/config', { method: 'POST', headers: { 'content-type': 'application/json' }, body: JSON.stringify({ eventId: eventRef }) }).catch(() => null);
      const j = r ? await r.json().catch(() => ({})) : {};
      if (!r || !r.ok) { toast(j.message || '无法连接服务器'); return; }
      patch.eventId = j.config.eventId; app.eventId = null; eventChanged = true;
    } else if (app.luma) { patch.eventId = String(fd.get('eventId') || '') || null; eventChanged = patch.eventId !== app.eventId; }
    await pushConfig(patch);
    const cell = Number(fd.get('cell'));
    if (cell && cell !== G.ch) { const u = new URL(location.href); u.searchParams.set('cell', cell); location.href = u.toString(); return; }
    if (eventChanged) { location.reload(); return; }
    closeModal(); toast('已保存');
  };
}
let toastT = 0;
function toast(msg) { const el = $('#toast'); el.textContent = msg; el.hidden = false; clearTimeout(toastT); toastT = setTimeout(() => el.hidden = true, 1800); }
function showErr(msg) { const el = $('#err'); el.textContent = msg; el.hidden = !msg; }

document.addEventListener('keydown', e => {
  if (e.target.matches('input,select,textarea')) { if (e.key === 'Escape') { e.target.blur(); if (!modal.hidden) closeModal(); } return; }
  const k = e.key.toLowerCase();
  if (k === 'escape') { if (!modal.hidden) closeModal(); else if (!desk.hidden) closeDesk(); }
  else if (k === 'd') { e.preventDefault(); desk.hidden ? openDesk() : closeDesk(); }
  else if (k === 'm') { e.preventDefault(); if (desk.hidden) openDesk(); manualModal(); }
  else if (k === 'f') { e.preventDefault(); document.fullscreenElement ? document.exitFullscreen() : document.documentElement.requestFullscreen().catch(() => {}); }
  else if (k === ' ' && app.mode === 'demo' && desk.hidden) { e.preventDefault(); demoCheckIn(); }
  else if (k === 'e' && e.shiftKey) { if (desk.hidden) openDesk(); exportCsv(); }
});
let resizeT = 0;
addEventListener('resize', () => { clearTimeout(resizeT); resizeT = setTimeout(layoutGrid, 150); });

// =====================================================================
//  BOOT
// =====================================================================
async function boot() {
  layoutGrid();
  frame();
  // served over http(s): keep retrying /health rather than falling back to demo on a network blip
  let h = null;
  for (let attempt = 0; ; attempt++) {
    try { const r = await api('/health', { cache: 'no-store' }); if (r.status === 401) { showErr('Wall is locked — open it with ?key=… in the URL.'); return; } h = await r.json(); break; }
    catch { if (location.protocol === 'file:' || params.has('demo') || attempt >= 60) break; app.error = 'connecting to server…'; await new Promise(r => setTimeout(r, 3000)); }
  }
  if (h) { app.server = !!h.ok; app.luma = !!h.luma; Object.assign(app.config, h.config || {}); app.poolTotals = h.pools || app.poolTotals; app.email = h.email || null; app.serverPolls = !!h.serverPolls; app.headline = h.eventName || ''; app.error = ''; }
  else app.server = false;
  const demo = params.has('demo') || (!params.has('manual') && (!app.server || (!app.luma && !app.config.eventId && !h.eventConfigured)));
  app.persist = app.server && !demo;
  if (app.persist) await syncState(); else if (!demo) loadLocal();
  for (const a of app.alloc.values()) if (!app.feed.includes(a)) app.feed.push(a);
  app.feed.sort((x, y) => new Date(y.checkedInAt || y.at) - new Date(x.checkedInAt || x.at));
  if (demo) {
    app.mode = 'demo'; seedDemo();
    const burstN = Number(params.get('burst') || 0);
    for (let i = 0; i < burstN; i++) setTimeout(demoCheckIn, 200 + i * 400);
    scheduleDemo();
  } else if (!app.luma) {
    app.mode = 'manual';
  } else {
    app.mode = 'luma';
    if (app.serverPolls) { await syncState(); if (DESK) ensureGuestsLoader(); }
    else try {
      const ev = await resolveEvent(); app.eventId = ev.id; app.eventName = ev.name || ''; app.eventStart = ev.start_at;
      const gc = ev.guest_counts && ev.guest_counts.approved; if (gc) app.total = gc.guests || 0;
      await syncLuma();
      const tick = async () => { await syncLuma(); setTimeout(tick, app.config.pollMs); }; setTimeout(tick, app.config.pollMs);
    } catch (e) { app.error = e.message; showErr('Luma: ' + e.message + ' — press D → settings to pick an event, or add ?demo to the URL.'); }
  }
  app.initial = false;
  if (app.persist) setInterval(syncState, app.serverPolls ? 2000 : 1000);
  document.documentElement.style.setProperty('--accent', accent().main);
  app.dirty = true;
  if (params.has('style')) { setStyle(Number(params.get('style')) || 0, nowS(), 0.01); if (params.has('hold')) morph.hold = true; }
  if (params.has('color')) { colorIdx = clamp(Number(params.get('color')) || 0, 0, BRAND.length - 1); document.documentElement.style.setProperty('--accent', accent().main); }
  if (params.get('modal') === 'manual') { openDesk(); manualModal(); }
  if (params.get('modal') === 'settings') { openDesk(); settingsModal(); }
  if (params.has('desk')) { openDesk(); const first = guestRows()[0]; if (first) { selectedKey = first.key; renderDesk(); } }
}
boot().catch(e => showErr(String(e.stack || e)));
</script>
</body>
